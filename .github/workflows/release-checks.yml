name: Student release checks
on:
  push:
    branches: [release/student-school-readiness]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  access-and-learning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r backend/requirements.release-tests.txt
      - run: pytest -c /dev/null backend/release_tests -q
        env:
          PYTHONPATH: backend
          ENVIRONMENT: test
          DATABASE_URL: sqlite://
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
